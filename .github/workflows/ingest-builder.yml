name: ingest-builder

on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-builder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dependency:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.pcs.outputs.image }}
      digest: ${{ steps.pcs.outputs.digest }}
      changed: ${{ steps.cache.outputs.cache-hit != 'true' }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Resolve and validate the latest BaiduPCS-Go image
        id: pcs
        run: |
          image=ghcr.io/kyxie/baidupcs-go
          digest=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$image@$digest" --raw > /tmp/pcs-manifest.json
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "amd64") and any(.platform.os == "linux" and .platform.architecture == "arm64")' /tmp/pcs-manifest.json
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: /tmp/ingest-pcs-built
          key: ingest-pcs-${{ steps.pcs.outputs.digest }}
          lookup-only: true

  verify:
    needs: dependency
    if: github.event_name != 'schedule' || needs.dependency.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate tag format
        if: github.event_name == 'push'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'ERROR: Tag must be semantic version like v1.2.3' >&2
            exit 1
          fi
      - uses: extractions/setup-just@v3
      - name: Verify source, scripts, and Compose
        run: just verify

  build:
    needs: [dependency, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          build-args: |
            PCS_IMAGE=${{ needs.dependency.outputs.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  record:
    needs: [dependency, build]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record successful image publication
        env:
          PCS_DIGEST: ${{ needs.dependency.outputs.digest }}
        run: printf '%s\n' "$PCS_DIGEST" > /tmp/ingest-pcs-built
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ingest-pcs-built
          key: ingest-pcs-${{ needs.dependency.outputs.digest }}
